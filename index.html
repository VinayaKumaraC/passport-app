<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ProPassport Photo Maker</title>

<!-- Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="manifest" href="/manifest.json">

<!-- External Libraries -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://unpkg.com/smartcrop@2.0.5/smartcrop.js"></script>

<style>
    :root {
        --primary: #4f46e5;
        --primary-hover: #4338ca;
        --secondary: #0d9488;
        --secondary-hover: #0f766e;
        --bg-main: #f1f5f9;
        --surface: #ffffff;
        --text-dark: #1e293b;
        --text-muted: #64748b;
        --border-color: #cbd5e1;
        --radius-lg: 1.25rem;
        --radius-sm: 0.75rem;
        --shadow-elevation: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
    }

    * {
        box-sizing: border-box;
        font-family: 'Plus Jakarta Sans', sans-serif;
        margin: 0;
        padding: 0;
    }

    body {
        background-color: var(--bg-main);
        color: var(--text-dark);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }

    /* Modern Glass Header */
    header {
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(10px);
        padding: 1rem 2rem;
        border-bottom: 1px solid var(--border-color);
        display: flex;
        align-items: center;
        justify-content: space-between;
        position: sticky;
        top: 0;
        z-index: 100;
    }

    header h1 {
        font-size: 1.25rem;
        font-weight: 700;
        color: var(--primary);
        display: flex;
        align-items: center;
        gap: 0.75rem;
    }

    /* Main Layout Grid */
    .container {
        max-width: 1280px;
        margin: 2rem auto;
        padding: 0 1.5rem;
        width: 100%;
        flex: 1;
    }

    .app-grid {
        display: grid;
        grid-template-columns: 400px 1fr;
        gap: 2rem;
        align-items: start;
    }

    /* Controls Panel */
    .controls-card {
        background: var(--surface);
        border-radius: var(--radius-lg);
        padding: 1.75rem;
        box-shadow: var(--shadow-elevation);
        border: 1px solid rgba(226, 232, 240, 0.8);
    }

    .step-section {
        margin-bottom: 1.75rem;
    }
    
    .step-section:last-child {
        margin-bottom: 0;
    }

    .step-header {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin-bottom: 1rem;
    }

    .step-number {
        background: var(--primary);
        color: white;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 0.8rem;
    }

    .step-title {
        font-size: 1rem;
        font-weight: 700;
        color: var(--text-dark);
    }

    label {
        display: block;
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--text-muted);
        margin-bottom: 0.4rem;
    }

    /* Modern Styled Dropdowns */
    .custom-select {
        width: 100%;
        padding: 0.85rem 1rem;
        font-size: 0.95rem;
        font-weight: 500;
        border: 1.5px solid var(--border-color);
        border-radius: var(--radius-sm);
        background-color: var(--surface);
        color: var(--text-dark);
        cursor: pointer;
        appearance: none;
        background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23475569%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
        background-repeat: no-repeat;
        background-position: right 1rem top 50%;
        background-size: 0.6rem auto;
        transition: all 0.2s ease;
        margin-bottom: 1rem;
    }

    .custom-select:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.15);
    }

    /* Modern Drag-and-Drop Uploader */
    .upload-zone {
        border: 2px dashed var(--border-color);
        border-radius: var(--radius-sm);
        padding: 2rem 1rem;
        text-align: center;
        background-color: #fafafa;
        cursor: pointer;
        transition: all 0.25s ease;
        position: relative;
    }

    .upload-zone:hover {
        border-color: var(--primary);
        background-color: #eef2ff;
    }

    .upload-zone input[type="file"] {
        position: absolute;
        inset: 0;
        opacity: 0;
        cursor: pointer;
        width: 100%;
        height: 100%;
    }

    .upload-icon {
        font-size: 2rem;
        margin-bottom: 0.5rem;
        display: block;
    }

    .upload-text {
        font-weight: 600;
        font-size: 0.95rem;
        color: var(--text-dark);
        margin-bottom: 0.15rem;
        display: block;
    }

    .upload-subtext {
        font-size: 0.8rem;
        color: var(--text-muted);
    }

    .status-msg {
        margin-top: 0.6rem;
        font-size: 0.85rem;
        color: #059669;
        font-weight: 600;
        display: none;
        text-align: center;
        background: #ecfdf5;
        padding: 0.4rem;
        border-radius: 0.4rem;
    }

    /* Modern Action Buttons */
    .btn-primary {
        width: 100%;
        background-color: var(--primary);
        color: white;
        border: none;
        padding: 0.95rem;
        border-radius: var(--radius-sm);
        font-size: 0.95rem;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.2s ease;
        margin-bottom: 0.75rem;
        box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
    }

    .btn-primary:hover:not(:disabled) {
        background-color: var(--primary-hover);
        transform: translateY(-1px);
    }

    .btn-secondary {
        width: 100%;
        background-color: var(--secondary);
        color: white;
        border: none;
        padding: 0.85rem;
        border-radius: var(--radius-sm);
        font-size: 0.95rem;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.2s ease;
        box-shadow: 0 4px 12px rgba(13, 148, 136, 0.25);
    }

    .btn-secondary:hover:not(:disabled) {
        background-color: var(--secondary-hover);
        transform: translateY(-1px);
    }

    .btn-primary:active, .btn-secondary:active {
        transform: scale(0.98);
    }

    .btn-primary:disabled, .btn-secondary:disabled {
        background-color: #cbd5e1;
        box-shadow: none;
        cursor: not-allowed;
        opacity: 0.7;
    }

    /* Preview Panel */
    .preview-card {
        background: var(--surface);
        border-radius: var(--radius-lg);
        padding: 1.75rem;
        box-shadow: var(--shadow-elevation);
        border: 1px solid rgba(226, 232, 240, 0.8);
        display: flex;
        flex-direction: column;
        align-items: center;
        overflow: hidden;
    }

    .preview-header {
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1.25rem;
        padding-bottom: 0.75rem;
        border-bottom: 1px solid var(--border-color);
    }

    .preview-header h2 {
        font-size: 1rem;
        font-weight: 700;
    }

    .preview-badge {
        background: #e0e7ff;
        color: #3730a3;
        padding: 0.25rem 0.75rem;
        border-radius: 2rem;
        font-size: 0.75rem;
        font-weight: 700;
    }

    /* Print Sheet Container */
    .canvas-scroll-area {
        max-width: 100%;
        overflow-x: auto;
        padding: 1.25rem;
        background: #f8fafc;
        border-radius: var(--radius-sm);
        border: 1px solid var(--border-color);
    }

    .sheet-4x6 {
        width: 6in;
        height: 4in;
        background: white;
        padding: 0.2in;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        grid-template-rows: repeat(2, 1fr);
        gap: 2mm;
        justify-content: center;
        align-content: center;
        box-sizing: border-box;
        box-shadow: 0 10px 20px rgba(0,0,0,0.06);
        margin: 0 auto;
    }

    .photo-frame {
        width: 3.5cm;
        height: 4.5cm;
        background-color: #ffffff;
        border: 2px solid #0f172a;
        box-sizing: border-box;
        margin: auto;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        border-radius: 4px;
    }

    .photo-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: top center; 
    }

    /* Responsive Breakdown */
    @media (max-width: 1024px) {
        .app-grid {
            grid-template-columns: 1fr; 
        }
    }

    @media (max-width: 480px) {
        .container {
            padding: 0 0.75rem;
            margin: 1rem auto;
        }
        .controls-card, .preview-card {
            padding: 1.25rem;
        }
    }
</style>
</head>
<body>

<header>
    <h1>📸 ProPassport</h1>
</header>

<div class="container">
    <div class="app-grid">
        
        <!-- Left Sidebar: Controls -->
        <aside class="controls-card">
            <!-- Step 1 -->
            <div class="step-section">
                <div class="step-header">
                    <div class="step-number">1</div>
                    <div class="step-title">Upload Photos</div>
                </div>
                <div class="upload-zone" id="uploadBox">
                    <span class="upload-icon">📥</span>
                    <span class="upload-text" id="uploadTextLabel">Tap to select photos</span>
                    <span class="upload-subtext">Upload up to 4 photos max</span>
                    <input type="file" id="imageInput" accept="image/png, image/jpeg, image/jpg" multiple>
                </div>
                <div id="aiStatus" class="status-msg">
                    ✨ AI Auto-Positioning Applied
                </div>
            </div>

            <!-- Step 2 -->
            <div class="step-section">
                <div class="step-header">
                    <div class="step-number">2</div>
                    <div class="step-title">Sheet Settings & Actions</div>
                </div>

                <label for="photoCount">Photos on Sheet:</label>
                <select id="photoCount" class="custom-select">
                    <option value="8" selected>8 Photos (Standard)</option>
                    <option value="6">6 Photos</option>
                    <option value="4">4 Photos</option>
                    <option value="2">2 Photos</option>
                </select>
                
                <label for="exportFormat">File Format:</label>
                <select id="exportFormat" class="custom-select">
                    <option value="png">High-Quality PNG</option>
                    <option value="jpg">Standard JPG</option>
                </select>
                
                <button class="btn-primary" id="generateBtn" disabled>
                    💾 Generate & Download
                </button>

                <button class="btn-secondary" id="shareBtn" disabled>
                    📤 Share Sheet to Print App
                </button>
            </div>
        </aside>

        <!-- Right Panel: Live Preview -->
        <main class="preview-card">
            <div class="preview-header">
                <h2>Live Layout Preview</h2>
                <span class="preview-badge" id="previewBadge">8 Photos on 4x6</span>
            </div>
            
            <div class="canvas-scroll-area">
                <div class="sheet-4x6" id="printArea">
                    <!-- Dynamic Grid Slots -->
                </div>
            </div>
        </main>

    </div>
</div>

<script>
    const imageInput = document.getElementById('imageInput');
    const printArea = document.getElementById('printArea');
    const generateBtn = document.getElementById('generateBtn');
    const shareBtn = document.getElementById('shareBtn');
    const exportFormat = document.getElementById('exportFormat');
    const photoCountSelect = document.getElementById('photoCount');
    const aiStatus = document.getElementById('aiStatus');
    const previewBadge = document.getElementById('previewBadge');
    const uploadTextLabel = document.getElementById('uploadTextLabel');

    let processedImages = [];

    // Modern Toast Notification Popup
    const toast = document.createElement('div');
    toast.style.cssText = `
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%) translateY(100px);
        background: #1e293b;
        color: white;
        padding: 12px 24px;
        border-radius: 12px;
        font-weight: 600;
        box-shadow: 0 15px 25px -5px rgba(0, 0, 0, 0.2);
        transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        z-index: 1000;
        font-size: 0.9rem;
    `;
    document.body.appendChild(toast);

    function showToast(message) {
        toast.innerText = message;
        toast.style.transform = 'translateX(-50%) translateY(0)';
        setTimeout(() => {
            toast.style.transform = 'translateX(-50%) translateY(100px)';
        }, 3500);
    }

    // Render Sheet layout
    function renderSheet(imageUrls = []) {
        printArea.innerHTML = '';
        const totalSlots = parseInt(photoCountSelect.value);
        previewBadge.innerText = `${totalSlots} Photos on 4x6`;

        let layoutImages = [];
        const numImgs = imageUrls.length;

        if (numImgs === 0) {
            layoutImages = new Array(totalSlots).fill(null);
        } else if (numImgs === 2) {
            const slotsPerRow = 4;
            const topRowCount = Math.min(Math.ceil(totalSlots / 2), slotsPerRow);
            const bottomRowCount = totalSlots - topRowCount;
            layoutImages = [
                ...new Array(topRowCount).fill(imageUrls[0]),
                ...new Array(bottomRowCount).fill(imageUrls[1])
            ];
        } else {
            for (let i = 0; i < totalSlots; i++) {
                const imgIndex = i % numImgs;
                layoutImages.push(imageUrls[imgIndex]);
            }
        }

        layoutImages.forEach(url => {
            const frame = document.createElement('div');
            frame.className = 'photo-frame';

            const img = document.createElement('img');
            img.className = 'photo-img';
            
            if (url) {
                img.src = url;
            } else {
                img.src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="350" height="450"><rect width="100%" height="100%" fill="%23f8fafc"/><circle cx="175" cy="180" r="60" fill="%23cbd5e1"/><path d="M75 450 Q 175 300 275 450" fill="%23cbd5e1"/></svg>';
            }
            
            frame.appendChild(img);
            printArea.appendChild(frame);
        });
    }

    renderSheet();

    photoCountSelect.addEventListener('change', () => {
        renderSheet(processedImages);
    });

    // Handle Upload & AI Processing
    imageInput.addEventListener('change', async function(e) {
        const files = Array.from(e.target.files).slice(0, 4);
        if (files.length > 0) {
            aiStatus.style.display = 'none';
            generateBtn.disabled = true;
            shareBtn.disabled = true;
            generateBtn.innerText = '✨ AI is Processing...';

            processedImages = [];

            for (let file of files) {
                await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        const rawImageUrl = event.target.result;
                        const imgObj = new Image();
                        imgObj.src = rawImageUrl;
                        imgObj.onload = function() {
                            SmartCrop.crop(imgObj, { width: 350, height: 450 }).then(function(result) {
                                const crop = result.topCrop;
                                const canvas = document.createElement('canvas');
                                canvas.width = 350;
                                canvas.height = 450;
                                const ctx = canvas.getContext('2d');
                                
                                ctx.drawImage(
                                    imgObj, 
                                    crop.x, crop.y, crop.width, crop.height, 
                                    0, 0, canvas.width, canvas.height
                                );

                                processedImages.push(canvas.toDataURL('image/png'));
                                resolve();
                            }).catch(() => {
                                processedImages.push(rawImageUrl);
                                resolve();
                            });
                        }
                    }
                    reader.readAsDataURL(file);
                });
            }

            uploadTextLabel.innerText = `${files.length} photo(s) loaded successfully`;
            renderSheet(processedImages);
            aiStatus.style.display = 'block';
            generateBtn.disabled = false;
            shareBtn.disabled = false;
            generateBtn.innerText = '💾 Generate & Download';
        }
    });

    // Download Handler
    generateBtn.addEventListener('click', () => {
        const originalText = generateBtn.innerText;
        generateBtn.innerText = 'Rendering Sheet...';
        generateBtn.disabled = true;
        shareBtn.disabled = true;

        const format = exportFormat.value;

        html2canvas(printArea, { scale: 4, useCORS: true, backgroundColor: "#ffffff" }).then(canvas => {
            const mimeType = format === 'jpg' ? 'image/jpeg' : 'image/png';
            const imageURL = canvas.toDataURL(mimeType, 1.0);
            
            const link = document.createElement('a');
            link.download = `Passport_Photos_4x6.${format}`;
            link.href = imageURL;
            link.click();

            generateBtn.innerText = originalText;
            generateBtn.disabled = false;
            shareBtn.disabled = false;

            showToast('🖼️ Successfully saved in gallery / downloads!');
        }).catch(err => {
            console.error("Error:", err);
            alert("Error generating the file.");
            generateBtn.innerText = originalText;
            generateBtn.disabled = false;
            shareBtn.disabled = false;
        });
    });

    // Share Handler
    shareBtn.addEventListener('click', () => {
        const originalText = shareBtn.innerText;
        shareBtn.innerText = 'Preparing Share...';
        shareBtn.disabled = true;

        const format = exportFormat.value;

        html2canvas(printArea, { scale: 4, useCORS: true, backgroundColor: "#ffffff" }).then(canvas => {
            const mimeType = format === 'jpg' ? 'image/jpeg' : 'image/png';
            
            canvas.toBlob(async (blob) => {
                const file = new File([blob], `Passport_Photos_4x6.${format}`, { type: mimeType });
                
                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    try {
                        await navigator.share({
                            title: 'Passport Photo Sheet',
                            text: 'Here is your 4x6 passport photo sheet ready for printing.',
                            files: [file],
                        });
                        showToast('📤 Shared successfully!');
                    } catch (error) {
                        if (error.name !== 'AbortError') {
                            console.error('Sharing failed', error);
                        }
                    }
                } else {
                    alert('Sharing files is not directly supported on this view/device, use Download instead.');
                }

                shareBtn.innerText = originalText;
                shareBtn.disabled = false;
            }, mimeType, 1.0);

        }).catch(err => {
            console.error("Error:", err);
            alert("Error preparing file for sharing.");
            shareBtn.innerText = originalText;
            shareBtn.disabled = false;
        });
    });
</script>

<!-- Service Worker Registration -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js')
        .then(registration => {
          console.log('Service Worker registered successfully');
        })
        .catch(err => {
          console.log('Service Worker registration failed: ', err);
        });
    });
  }
</script>

</body>
</html>
